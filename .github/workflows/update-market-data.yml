name: Update market data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"           # Regular frequent refresh (with rotation + treasure priority)
    - cron: "30 2 * * 1-5"           # ~11:30 JST - end of morning trading session: PRIORITY full refresh of all ranking stocks
    - cron: "0 6 * * 1-5"            # ~15:00 JST - end of afternoon trading session (close): PRIORITY full refresh of all ranking stocks

permissions:
  contents: write

jobs:
  update-market-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history so that rebase before push works reliably when other jobs push concurrently

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch J-Quants data
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_PLAN: light
          JQUANTS_HISTORY_DAYS: "1825"
          JQUANTS_MAX_REQUESTS_PER_RUN: "18"
          # Used by api/market-data.js to rotate a limited subset of tickers per run (prevents quota exhaustion
          # and ensures previously-stale prices like some treasure/integrated-ranking stocks get refreshed regularly).
          JQUANTS_INSTRUMENT_QUOTE_REQUESTS_PER_RUN: "36"
          JQUANTS_ENABLE_FINANCIALS: "1"
          JQUANTS_FINANCIALS_PER_RUN: "12"
          JQUANTS_PRO_ACCESS_KEY: ${{ secrets.JQUANTS_PRO_ACCESS_KEY }}
          JQUANTS_PRO_BASE_URL: ${{ secrets.JQUANTS_PRO_BASE_URL }}
          JQUANTS_FINANCIALS_BASE_URL: ${{ secrets.JQUANTS_FINANCIALS_BASE_URL }}
          MARKET_DATA_OUTPUT_PATH: docs/fund-flow-ai-system/data/market-data.json
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FX_API_URL: ${{ secrets.FX_API_URL }}
          RATES_API_URL: ${{ secrets.RATES_API_URL }}
          BOJ_STAT_API_URL: ${{ secrets.BOJ_STAT_API_URL }}
          # When set to 1, forces a full refresh of *all* ranking/treasure tickers (bypasses rotation).
          # Also automatically triggered by time windows inside the JS around morning/afternoon session ends.
          PRIORITY_RANKING_REFRESH: "0"
        run: node scripts/update-market-data.js

      - name: Run Gemini theme research
        env:
          GEMINI_API_KEY: ${{ secrets.FUND_FLOW_GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          MARKET_DATA_INPUT_PATH: docs/fund-flow-ai-system/data/market-data.json
          AI_RESEARCH_OUTPUT_PATH: docs/fund-flow-ai-system/data/ai-research.json
        run: node scripts/update-ai-research.js

      - name: Update ranking history
        env:
          MARKET_DATA_INPUT_PATH: docs/fund-flow-ai-system/data/market-data.json
          RANKING_HISTORY_OUTPUT_PATH: docs/fund-flow-ai-system/data/ranking-history.json
        run: node scripts/update-ranking-history.js

      - name: Update integrated stock ranking
        env:
          MARKET_DATA_INPUT_PATH: docs/fund-flow-ai-system/data/market-data.json
          TREASURE_STOCKS_OUTPUT_PATH: docs/fund-flow-ai-system/data/treasure-stocks.json
        run: node scripts/update-treasure-stocks.js

      - name: Update integrated ranking history
        env:
          TREASURE_STOCKS_INPUT_PATH: docs/fund-flow-ai-system/data/treasure-stocks.json
          INTEGRATED_RANKING_HISTORY_PATH: docs/fund-flow-ai-system/data/integrated-ranking-history.json
          INTEGRATED_RANKING_LIMIT: "10"
          INTEGRATED_RANKING_INCLUDE_ETF: "0"
        run: node scripts/update-integrated-ranking-history.js

      - name: Update buy-target observations
        # 買い目標到達 観測スペースをサーバー側で更新（標準/ゆるめ別の到達検知 + 利確/損切判定）。
        # 結果は integrated-obs.json として公開され、全端末で同じ観測状態が共有される。
        env:
          TREASURE_STOCKS_INPUT_PATH: docs/fund-flow-ai-system/data/treasure-stocks.json
          INTEGRATED_OBS_PATH: docs/fund-flow-ai-system/data/integrated-obs.json
        run: node scripts/update-integrated-obs.js

      - name: Sync integrated ranking to Google Sheet
        # Keep public page (committed treasure-stocks.json) and spreadsheet in sync by using the exact same
        # just-generated ranking + history for the sheet update. Run frequently so sheet is not stale.
        continue-on-error: true
        env:
          INTEGRATED_RANKING_WEBHOOK_URL: ${{ secrets.INTEGRATED_RANKING_WEBHOOK_URL }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          TREASURE_STOCKS_INPUT_PATH: docs/fund-flow-ai-system/data/treasure-stocks.json
          INTEGRATED_RANKING_HISTORY_PATH: docs/fund-flow-ai-system/data/integrated-ranking-history.json
          INTEGRATED_RANKING_LIMIT: "10"
          INTEGRATED_RANKING_REPLACE: "1"
          INTEGRATED_RANKING_INCLUDE_ETF: "0"
        run: node scripts/sync-integrated-ranking-sheet.js

      - name: Commit market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/fund-flow-ai-system/data/market-data.json docs/fund-flow-ai-system/data/ai-research.json docs/fund-flow-ai-system/data/ranking-history.json docs/fund-flow-ai-system/data/treasure-stocks.json docs/fund-flow-ai-system/data/integrated-ranking-history.json docs/fund-flow-ai-system/data/integrated-obs.json
          
          if git diff --cached --quiet; then
            echo "No data changes to commit"
            exit 0
          fi

          git commit -m "Update market data"

          echo "Pushing with retry + rebase (to handle concurrent updates from schedules or manual pushes)..."
          for attempt in 1 2 3; do
            echo "Push attempt $attempt..."
            if git push origin main; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi

            echo "Push rejected (likely another job pushed). Fetching and rebasing..."
            git fetch origin
            if ! git pull --rebase origin main; then
              echo "Rebase encountered issues, aborting rebase..."
              git rebase --abort || true
            fi
            sleep 8
          done

          echo "❌ All 3 push attempts failed. Giving up for this run."
          exit 1
