name: Price Check (15min during trading hours)

on:
  schedule:
    # 取引時間中（JST 9:00〜15:30）に15分おきに実行
    # UTC 0:00〜6:30 = JST 9:00〜15:30（夏時間考慮なし）
    - cron: '0,15,30,45 0,1,2,3,4,5 * * 1-5'
    - cron: '0,15 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  price-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 実績ファイルのコミット時に rebase push するため全履歴を取得

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # LINE通知は2026-07-03に停止（観測スペース側 update-integrated-obs.js の通知に一本化）。
      # LINE_ACCESS_TOKEN / LINE_USER_ID を渡さないことで auto_trader.py 側が自動スキップする。
      - name: Run Price Check Only
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python auto_trader.py --mode check_only

      # 利確/損切の実績（trade_results.json）をコミットして学習ループを永続化する。
      # 従来はランナー上に書き捨てで毎回消えており、戦略自動切替が常に「実績少」のままだった。
      - name: Commit trade results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trade_results.json strategies.json

          if git diff --cached --quiet; then
            echo "No trade result changes to commit"
            exit 0
          fi

          git commit -m "Update trade results"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✅ Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push rejected (likely another job pushed). Fetching and rebasing..."
            git fetch origin
            if ! git pull --rebase origin main; then
              git rebase --abort || true
            fi
            sleep 8
          done
          echo "❌ All 3 push attempts failed. Giving up for this run."
          exit 1
