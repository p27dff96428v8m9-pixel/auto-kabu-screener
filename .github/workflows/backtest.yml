name: Monthly strategy backtest

# 戦略バックテスト＋winRate較正表(backtest.json)の月次更新。
# update-treasure-stocks.js が winRateCalibrated の算出に backtest.json を使う。

on:
  workflow_dispatch:
  schedule:
    - cron: "20 20 1 * *" # 毎月1日 JST 5:20（市場・他ワークフローと重ならない時間帯）

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run backtest (refresh 5y daily bars)
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          JQUANTS_REFRESH_TOKEN: ${{ secrets.JQUANTS_REFRESH_TOKEN }}
        run: node scripts/backtest-strategy.js --refresh

      - name: Commit backtest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/fund-flow-ai-system/data/backtest.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update strategy backtest & winRate calibration"
          git pull --rebase origin main
          git push origin main
