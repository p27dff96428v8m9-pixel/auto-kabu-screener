name: 年1回データ更新（Standard月に実行）

# ── 使い方（年1回・J-QuantsをStandardにした月に1回だけ）──────────────────
# 1. J-Quants (https://jpx-jquants.com/) でプランを Standard に変更する（月3,300円）
# 2. マイページでAPIキーを確認し、GitHubリポジトリの
#    Settings > Secrets and variables > Actions > JQUANTS_API_KEY を新キーで更新する
#    （キーが変わっていなければこの手順は不要。次のステップ0が自動で判定してくれる）
# 3. GitHubの Actions タブ → 左の「年1回データ更新（Standard月に実行）」→ 右の「Run workflow」ボタン
# 4. 全ステップが緑になったら完了。J-Quantsのプランを Light に戻す（忘れると翌月も課金）
#
# やってくれること:
#   - Standardプランが有効かの事前チェック（無効なら日本語エラーで停止）
#   - 10年分の日足でバックテスト再較正（backtest.json 更新 → 勝率較正・戦略検証の土台）
#   - 信用残（銘柄別・週次）・空売り比率（33業種・日次）の10年分収穫 → research-data/ にコミット
# 詳しい背景は ANNUAL_UPDATE.md 参照。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "0. Standardプランの事前チェック"
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          node -e "
          (async () => {
            const key = process.env.JQUANTS_API_KEY;
            if (!key) { console.error('❌ JQUANTS_API_KEY シークレットが未設定です'); process.exit(1); }
            const r = await fetch('https://api.jquants.com/v2/markets/margin-interest?code=72030', { headers: { 'x-api-key': key } });
            if (r.ok) { console.log('✅ Standardプラン有効（信用残エンドポイントにアクセスできました）'); return; }
            console.error('❌ 信用残データにアクセスできません (HTTP ' + r.status + ')');
            console.error('   考えられる原因:');
            console.error('   1. J-QuantsのプランがStandardになっていない → マイページでプラン変更');
            console.error('   2. GitHubのSecret JQUANTS_API_KEY が古い → マイページのキーで更新');
            process.exit(1);
          })();
          "

      - name: "1. 10年バックテスト再較正（数分かかります）"
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          BACKTEST_HISTORY_DAYS: "3650"
        run: node scripts/backtest-strategy.js --refresh

      - name: "2. 信用残・空売り比率の10年分収穫"
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          MARGIN_SHORT_OUTPUT_DIR: research-data
        run: node scripts/fetch-margin-short.js

      - name: "3. 結果をコミット"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          DATA_FILES="docs/fund-flow-ai-system/data/backtest.json research-data"
          git add $DATA_FILES

          if git diff --cached --quiet; then
            echo "変更なし（データは最新です）"
            exit 0
          fi

          git commit -m "年次データ更新: 10年較正 + 信用残/空売り比率の収穫"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "✅ 完了。J-QuantsのプランをLightに戻すのを忘れずに！"
              exit 0
            fi
            git fetch origin main
            git reset --mixed FETCH_HEAD
            git add $DATA_FILES
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "年次データ更新: 10年較正 + 信用残/空売り比率の収穫"
            sleep $((attempt * 3))
          done
          exit 1

      - name: "4. 完了をLINE通知（Light戻し忘れ防止）"
        if: always()
        env:
          LINE_ACCESS_TOKEN: ${{ secrets.LINE_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          node -e "
          (async () => {
            const token = process.env.LINE_ACCESS_TOKEN;
            const userId = process.env.LINE_USER_ID;
            if (!token || !userId) { console.log('LINE未設定のためスキップ'); return; }
            const ok = process.env.JOB_STATUS === 'success';
            const text = ok
              ? '✅年1回のデータ更新が完了しました（10年較正・信用残・空売り比率）。\n⚠️最後の仕上げ: J-QuantsのプランをLightに戻してください（忘れると翌月も3,300円かかります）\nhttps://jpx-jquants.com/'
              : '❌年1回のデータ更新が失敗しました。GitHubのActionsログを確認してください（原因はほぼ「Standardプラン未変更」か「JQUANTS_API_KEY未更新」のどちらか）。';
            const res = await fetch('https://api.line.me/v2/bot/message/push', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
              body: JSON.stringify({ to: userId, messages: [{ type: 'text', text }] })
            });
            console.log('LINE通知:', res.status);
          })();
          "
